name: Verificar publicador editorial

on:
  push:
    paths:
      - scripts/publish_article.py
      - tests/test_editorial_pipeline.py
      - .github/workflows/publish-daily-articles.yml
      - .github/workflows/editorial-tests.yml
  pull_request:
    paths:
      - scripts/publish_article.py
      - tests/test_editorial_pipeline.py
      - .github/workflows/publish-daily-articles.yml
      - .github/workflows/editorial-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validar sintaxis del publicador
        run: python -m py_compile scripts/publish_article.py

      - name: Ejecutar pruebas de publicación en carpeta temporal
        run: python -m unittest discover -s tests -p 'test_editorial_pipeline.py' -v
